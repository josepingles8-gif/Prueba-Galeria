<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<title>Galería</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="ib" id="tb-back" hidden aria-label="Atrás" data-icon="back"></button>
    <div id="tb-title"></div>
    <div id="tb-actions"></div>
  </header>
  <div id="selbar">
    <button class="ib" id="sel-close" aria-label="Cancelar" data-icon="close"></button>
    <div id="sel-count">Seleccionar elementos</div>
    <button id="sel-all" class="all"><span class="chk"></span>Todo</button>
  </div>
  <main id="scroll">
    <div id="lt"><h1></h1><p class="sub"></p><div id="lt-extra"></div></div>
    <div id="body"></div>
  </main>
  <nav id="tabbar">
    <a class="tab" data-tab="images" href="#/"><span class="ti" data-icon="photo"></span><span>Imágenes</span></a>
    <a class="tab" data-tab="albums" href="#/albums"><span class="ti" data-icon="album"></span><span>Álbumes</span></a>
    <a class="tab" data-tab="stories" href="#/stories"><span class="ti" data-icon="star"></span><span>Historias</span></a>
    <button class="tab" id="tab-menu"><span class="ti" data-icon="menu"></span><span>Menú</span></button>
  </nav>
  <div id="actionbar"></div>
</div>
<input type="file" id="file-input" multiple accept="image/*,video/*" hidden>
<div id="boot" class="boot">Preparando galería…</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
